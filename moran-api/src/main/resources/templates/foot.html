<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF</title>
</head>
<style>
  /* 如果打印出样式左右空白过多,可以去掉.main的宽度限制 */
  /* 公共样式 */
  h2, h3, p, span, div, img, li {
    margin: 0;
  }
  ul{
    margin: 0;
    padding: 0 0 0 30px;
  }
  table {
    border-collapse: collapse; /* 合并边框 */
  }
  
  td, th {
    border: 1px solid black; /* 设置边框宽度、样式和颜色 */
  }
  .theme-color{
    color: 449297;
  }
  .flex {
    display: flex;
  }
  .column {
    display: flex;
    flex-direction: column;
  }
  .item-center {
    display: flex;
    align-items: center;
  }
  .item-end {
    display: flex;
    align-items: end;
  }
  .justify-between {
    display: flex;
    justify-content: space-between;
  }
  .strong {
    font-weight: bold;
  }
  .large-text {
    font-size: 20px;
  }
  .normal-text{
    font-size: 16px;
  }
  .small-text {
    font-size: 14px;
  }
  .mini-text {
    font-size: 12px;
  }
  .p-20px{
    padding: 20px;
  }
  .p-5px{
    padding: 5px;
  }
  .pl-10px {
    padding-left: 10px;
  }
  .mb-0 {
    margin-bottom: 0 !important;
  }
  .mb-10px {
    margin-bottom: 10px !important;
  }
  .mb-20px {
    margin-bottom: 20px;
  }
  .mt-0{
    margin-top: 0 !important;
  }
  .mt-2px{
    margin-top: 2px !important;
  }
  .mt-10px {
    margin-top: 10px !important;
  }
  .mt-20px {
    margin-top: 20px;
  }
  .mt-30px {
    margin-top: 30px;
  }
  .mx-10px {
    margin-left: 10px;
    margin-right: 10px;
  }
  .align-right{
    text-align: right;
  }
  .w-50{
    width: 50%;
  }
  .w-47{
    width: 47%;
  }
  .w-60{
    width: 60%;
  }
  .w-40{
    width: 40%;
  }
  .w-70{
    width: 70%;
  }
  .w-30{
    width: 30%;
  }
  .w-80{
    width: 80%;
  }
  .w-20{
    width: 20%;
  }
  .line {
    width: 100%;
    height: 1px;
    background-color: #000;
    margin: 20px 0;
  }
  .line-30px{
    line-height: 30px;
  }
  .line-20px{
    line-height: 20px;
  }
  .label-width {
    width: 150px;
    border-right: 1px solid #000;
  }

  .border-radius {
    border: 1px solid #000;
    border-radius: 5px;
  }
  .border{
    border: 1px solid #000;
  }

  /* 页面样式 */
  .main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px 30px;
  }
  .logo {
    width: 256px;
    height: 125px;
    object-fit: cover;
  }
  .header-img{
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .table-box{
    width: 100%;
  }
  .table-box td{
    height: 300px;
  }
  .official-use {
    background-color: #e0e0e0;
    padding: 10px;
  }
</style>
<body>
  <div class="main">
    <div class="mini-text mt-10px align-right">
      <p><span class="strong">Team AutoCare Pte. Ltd.</span> (Registration No: 202013212Z)</p>
      <p>160 Sin Ming Drive, #02-12, Sin Ming AutoCity, Singapore 575722</p>
      <p>Tel: 6258-1955 Fax: 6258-1956 Email: teamautooffice@gmail.com / teamautopl@gmail.com</p>
    </div>
  </div>
</body>
</html>
